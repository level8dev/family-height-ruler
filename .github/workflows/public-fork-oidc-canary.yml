name: Public fork pr-ci Kennedy canary

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  protected-job-one:
    name: Protected canary job one
    if: github.event.pull_request.user.login == 'level8dev'
    runs-on: ubuntu-latest
    environment:
      name: pr-ci
      deployment: true
    steps:
      - name: Confirm Kennedy released job one
        shell: bash
        run: |
          set -euo pipefail
          echo "SUCCESS: Kennedy released protected canary job one."

  protected-job-two:
    name: Protected canary job two
    if: github.event.pull_request.user.login == 'level8dev'
    runs-on: ubuntu-latest
    environment:
      name: pr-ci
      deployment: true
    steps:
      - name: Confirm Kennedy released job two
        shell: bash
        run: |
          set -euo pipefail
          echo "SUCCESS: Kennedy released protected canary job two."
